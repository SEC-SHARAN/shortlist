server {
  listen 80;
  client_max_body_size 520m;           # up to 50 files x 10 MB per upload request
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 300s; }
  location / { try_files $uri /index.html; }
}
